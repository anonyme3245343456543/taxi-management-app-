<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration taxi</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body data-page-title="pageTitleAdmin">
    <div class="language-switcher" data-language-switcher></div>
    <div id="login-view" class="login-shell">
      <form id="login-form" class="panel login-panel" novalidate>
        <p class="eyebrow" data-i18n="adminEyebrow">Admin</p>
        <h1 data-i18n="signIn">Connexion</h1>
        <label><span data-i18n="username">Nom d'utilisateur</span><input name="username" autocomplete="username" required></label>
        <label><span data-i18n="password">Mot de passe</span><input name="password" type="password" autocomplete="current-password" required></label>
        <div id="login-message" class="message" aria-live="polite"></div>
        <button class="primary" type="submit" data-i18n="signIn">Connexion</button>
      </form>
    </div>

    <div id="app-view" class="app-shell hidden">
      <aside class="sidebar">
        <div>
          <p class="eyebrow" data-i18n="taxiAdmin">Administration taxi</p>
          <h1 data-i18n="dispatch">Planning</h1>
        </div>
        <nav>
          <button data-section="dashboard" class="nav-item active" data-i18n="dashboard">Tableau de bord</button>
          <button data-section="appointments" class="nav-item" data-i18n="appointments">Rendez-vous</button>
          <button data-section="clients" class="nav-item" data-i18n="clients">Clients</button>
        </nav>
        <button id="logout-button" class="ghost" data-i18n="signOut">Déconnexion</button>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" data-i18n="management">Gestion</p>
            <h2 id="section-title">Tableau de bord</h2>
          </div>
          <div class="search-row">
            <input id="global-search" placeholder="Rechercher clients, téléphones, adresses" data-i18n-placeholder="searchPlaceholder">
            <select id="status-filter">
              <option value="" data-i18n="allStatuses">Tous les statuts</option>
              <option value="pending" data-i18n="pending">En attente</option>
              <option value="confirmed" data-i18n="confirmed">Confirmé</option>
              <option value="in_progress" data-i18n="inProgress">En cours</option>
              <option value="completed" data-i18n="completed">Terminé</option>
              <option value="cancelled" data-i18n="cancelled">Annulé</option>
              <option value="no_show" data-i18n="noShow">Absent</option>
            </select>
          </div>
        </header>
        <div id="app-message" class="message app-message" aria-live="polite"></div>

        <section id="dashboard" class="section active">
          <div class="stats-grid">
            <article><span data-i18n="totalRides">Trajets totaux</span><strong id="stat-total">0</strong></article>
            <article><span data-i18n="completedRevenue">Revenus terminés</span><strong id="stat-revenue">€0.00</strong></article>
            <article><span data-i18n="pending">En attente</span><strong id="stat-pending">0</strong></article>
            <article><span data-i18n="completed">Terminé</span><strong id="stat-completed">0</strong></article>
          </div>
          <div class="panel">
            <h3 data-i18n="revenueByMonth">Revenus par mois</h3>
            <div id="monthly-revenue" class="bars"></div>
          </div>
        </section>

        <section id="appointments" class="section">
          <div class="section-actions">
            <h3 data-i18n="appointments">Rendez-vous</h3>
            <button id="new-appointment" class="primary" data-i18n="addAppointment">Ajouter un rendez-vous</button>
          </div>
          <div id="appointments-list" class="data-list"></div>
        </section>

        <section id="clients" class="section">
          <div class="section-actions">
            <h3 data-i18n="clients">Clients</h3>
            <button id="new-client" class="primary" data-i18n="addClient">Ajouter un client</button>
          </div>
          <div id="clients-list" class="data-list"></div>
        </section>
      </main>
    </div>

    <dialog id="modal">
      <form id="modal-form" method="dialog" class="modal-form"></form>
    </dialog>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/admin.js"></script>
  </body>
</html>
