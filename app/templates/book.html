<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Réserver un taxi</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body class="public-page" data-page-title="pageTitleBook">
    <div class="language-switcher" data-language-switcher></div>
    <main class="booking-shell">
      <section class="booking-intro">
        <p class="eyebrow" data-i18n="bookingEyebrow">Réservation taxi</p>
        <h1 data-i18n="bookingTitle">Demandez votre trajet</h1>
        <p data-i18n="bookingIntro">Envoyez les détails de votre trajet et l'équipe confirmera votre rendez-vous.</p>
      </section>

      <section class="panel">
        <form id="booking-form" class="form-grid" novalidate>
          <label><span data-i18n="name">Nom</span><input name="name" autocomplete="name" required></label>
          <label><span data-i18n="phone">Téléphone</span><input name="phone" autocomplete="tel" required></label>
          <label class="span-2"><span data-i18n="pickupAddress">Adresse de départ</span><input name="pickup_address" autocomplete="street-address" required></label>
          <label class="span-2"><span data-i18n="destination">Destination</span><input name="destination" required></label>
          <label><span data-i18n="date">Date</span><input name="date" type="date" required></label>
          <label><span data-i18n="time">Heure</span><input name="time" type="time" required></label>
          <label><span data-i18n="passengers">Passagers</span><input name="passenger_count" type="number" min="1" max="99" value="1" required></label>
          <label class="span-2"><span data-i18n="notes">Notes</span><textarea name="notes" rows="4"></textarea></label>
          <div id="booking-message" class="message span-2" aria-live="polite"></div>
          <button class="primary span-2" type="submit" data-i18n="submitBooking">Envoyer la réservation</button>
        </form>
      </section>
    </main>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/book.js"></script>
  </body>
</html>
